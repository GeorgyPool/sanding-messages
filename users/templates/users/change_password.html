{% extends 'sending/include/base.html' %}

{% block title %}Информация о пользователе{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center">
    <h5>Замена пароля для пользователя {{ user.email }}</h5>
</div>

<p class="text-center">Запомните новый пароль</p>

<div class="container d-flex justify-content-center">
    <form method="post">
        {% csrf_token %}
        <input class="form-control" type="password" name="password" placeholder="Новый пароль">
        <button type="submit" class="btn btn-primary mt-5 mb-5">Подтвердить</button>
    </form>
</div>

{% endblock %}
