{% extends 'sending/include/base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}

<h1 class="text-center text-white">Вход</h1>

<div class="container d-flex justify-content-center">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Вход</button>
        <a href="{% url 'sending:home' %}" class="btn btn-danger">Отмена</a>
    </form>
</div>

<p class="text-center">
    <a href="{% url 'users:password_recovery' %}" class="btn btn-link">Забыли пароль?</a>
</p>

{% endblock %}
