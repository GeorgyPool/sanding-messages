{% extends 'sending/include/base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}

<p class="text-center">Отправим вам письмо на электронную почту для восстановления</p>
<div class="container d-flex justify-content-center">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary">Восстановить пароль</button>
        <a href="{% url 'users:login' %}" class="btn btn-danger">Отмена</a>
    </form>
</div>

{% endblock %}
