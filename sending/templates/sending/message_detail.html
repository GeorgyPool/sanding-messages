{% extends 'sending/include/base.html' %}

{% block title %}Подробно о: {{ messages.title }}{% endblock %}

{% block content %}

<div class="container mt-2 mb-2">
    <a class="btn btn-outline-primary" href="{% url 'sending:messages' %}">назад</a>
</div>

<div class="container d-flex justify-content-center">
    <div class="card rounded-3">
        <div class="card-body bg-primary bg-gradient text-white rounded-3">
            <h5 class="card-title">Тема письма: {{ messages.title }}</h5>
            <p class="card-text">Текст сообщения:</p>
            <p class="card-text">{{ messages.text }}</p>
        </div>
    </div>
</div>

<div class="container d-flex justify-content-center mt-5">
    <p>
        <a class="btn btn-outline-primary me-2 ms-2" href="{% url 'sending:message_update' messages.pk %}">Редактировать</a>
        <a class="btn btn-danger me-2 ms-2" href="{% url 'sending:message_delete' messages.pk %}">Удалить</a>
    </p>
</div>

{% endblock %}
