{% extends 'sending/include/base.html' %}

{% block title %}Удаление: {{ message.title }}{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center">
    <h1>Вы действительно хотите удалить сообщение:</h1>
</div>

<div class="container d-flex justify-content-center">
    <div class="card bg-primary bg-gradient text-white rounded-3 mb-5">
        <h1>{{ message.title }}</h1>
    </div>
</div>

<div class="container d-flex justify-content-center">
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Удалить</button>
    </form>
</div>

{% endblock %}
