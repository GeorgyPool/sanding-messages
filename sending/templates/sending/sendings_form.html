{% extends 'sending/include/base.html' %}

{% block title %}Добавить рассылку{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center">
    <div class="card">
        <div class="card-body bg-secondary bg-gradient rounded-3">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
